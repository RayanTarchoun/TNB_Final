; Reglages PHP pour l'environnement de developpement.

memory_limit = 512M
max_execution_time = 60

display_errors = On
display_startup_errors = On
error_reporting = E_ALL

date.timezone = Europe/Paris

; Opcache en mode revalidation : les modifications de code sont prises en
; compte immediatement.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

upload_max_filesize = 8M
post_max_size = 8M

; La session porte le panier : cookie inaccessible au JavaScript.
session.cookie_httponly = 1
session.use_strict_mode = 1
