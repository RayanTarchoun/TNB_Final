; Reglages PHP pour l'environnement de production.

memory_limit = 256M
max_execution_time = 30

; Aucune erreur n'est renvoyee au navigateur : elles partent dans les logs.
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
log_errors = On
error_log = /proc/self/fd/2

; Masque la version de PHP dans les en-tetes HTTP.
expose_php = Off

date.timezone = Europe/Paris

; Opcache optimise : le code ne changeant plus, aucune revalidation.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16
opcache.preload = /var/www/html/config/preload.php
opcache.preload_user = www-data

realpath_cache_size = 4096K
realpath_cache_ttl = 600

upload_max_filesize = 8M
post_max_size = 8M

session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1
