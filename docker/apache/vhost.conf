<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride None
        Require all granted

        # Controleur frontal Symfony : toute URL qui ne correspond pas a un
        # fichier existant est routee vers index.php.
        FallbackResource /index.php
    </Directory>

    # Aucun acces direct au code source ni aux fichiers de configuration.
    <Directory /var/www/html>
        <FilesMatch "\.(env|yaml|yml|lock|json|md|dist)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # En-tetes de securite (defense en profondeur, chap. IX).
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
