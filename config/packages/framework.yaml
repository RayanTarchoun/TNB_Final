# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    annotations: false
    http_method_override: false
    handle_all_throwables: true

    default_locale: fr

    # Necessaire pour generer des URL absolues hors requete HTTP
    # (emails de confirmation envoyes depuis un service ou la console).
    router:
        default_uri: '%env(DEFAULT_URI)%'

    translator:
        default_path: '%kernel.project_dir%/translations'
        fallbacks: ['fr']

    # Le panier est stocke en session (PanierService)
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        cookie_httponly: true

    php_errors:
        log: true

    # Client HTTP utilise pour l'API meteo externe (MeteoMarcheService)
    http_client:
        scoped_clients:
            meteo.client:
                base_uri: '%env(METEO_API_URL)%'
                timeout: 3
                max_duration: 5

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
