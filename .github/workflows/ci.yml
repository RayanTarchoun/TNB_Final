name: CI

# Pipeline d'integration et de livraison continues (dossier chap. IV.5).
#
#   push sur develop/main, Pull Request  -> qualite, tests, build de l'image
#   push d'un tag v*                     -> publication de l'image sur Docker Hub
on:
    push:
        branches: [main, develop]
        tags: ['v*']
    pull_request:
        branches: [main, develop]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    qualite:
        name: Qualite de code (PSR-12 + analyse statique)
        runs-on: ubuntu-latest

        steps:
            - name: Recuperation du code
              uses: actions/checkout@v4

            - name: Installation de PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: intl, pdo_mysql, zip, gd, mbstring
                  coverage: none
                  tools: composer:v2

            - name: Cache des dependances Composer
              uses: actions/cache@v4
              with:
                  path: vendor
                  key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
                  restore-keys: composer-${{ runner.os }}-

            - name: Installation des dependances
              run: composer install --prefer-dist --no-progress --no-interaction

            - name: Respect des normes PSR-12 (PHP CS Fixer)
              run: vendor/bin/php-cs-fixer fix --dry-run --diff --show-progress=none

            - name: Prechauffage du conteneur de test (requis par PHPStan)
              run: php bin/console cache:warmup --env=test
              env:
                  APP_ENV: test

            - name: Analyse statique (PHPStan niveau 6)
              run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

    tests:
        name: Tests unitaires et fonctionnels
        runs-on: ubuntu-latest

        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: tnb
                    MYSQL_USER: tnb
                    MYSQL_PASSWORD: tnb
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping -h localhost -u root -proot"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=20

        steps:
            - name: Recuperation du code
              uses: actions/checkout@v4

            - name: Installation de PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: intl, pdo_mysql, zip, gd, mbstring
                  coverage: none
                  tools: composer:v2

            - name: Cache des dependances Composer
              uses: actions/cache@v4
              with:
                  path: vendor
                  key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
                  restore-keys: composer-${{ runner.os }}-

            - name: Installation des dependances
              run: composer install --prefer-dist --no-progress --no-interaction

            - name: Droits sur la base de test
              # Doctrine ajoute le suffixe "_test" : l'utilisateur applicatif
              # doit pouvoir creer et remplir "tnb_test".
              run: |
                  mysql -h 127.0.0.1 -u root -proot -e "
                    CREATE DATABASE IF NOT EXISTS \`tnb_test\`
                      CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
                    GRANT ALL PRIVILEGES ON \`tnb\_test\`.* TO 'tnb'@'%';
                    FLUSH PRIVILEGES;"

            - name: Installation du pilote de navigateur (tests Panther)
              # Les runners GitHub embarquent Chrome ; bdi telecharge le
              # chromedriver correspondant a sa version exacte.
              run: vendor/bin/bdi detect drivers

            - name: Verification du mapping Doctrine
              # --skip-sync : les colonnes ENUM natives du MPD sont declarees
              # via columnDefinition, que le comparateur ne sait pas introspecter
              # (voir README, section "Base de donnees").
              run: php bin/console doctrine:schema:validate --skip-sync --env=test

            - name: Tests unitaires et fonctionnels (PHPUnit)
              run: php bin/phpunit --no-coverage

    image-docker:
        name: Construction de l'image Docker
        runs-on: ubuntu-latest
        needs: [qualite, tests]

        steps:
            - name: Recuperation du code
              uses: actions/checkout@v4

            - name: Configuration de Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build de l'image de production
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: docker/php/Dockerfile
                  target: prod
                  push: false
                  tags: tnb:ci
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    publication:
        name: Publication de l'image sur Docker Hub
        runs-on: ubuntu-latest
        needs: [image-docker]
        # Volet CD : seul un tag de release declenche une publication.
        if: startsWith(github.ref, 'refs/tags/v')

        steps:
            - name: Recuperation du code
              uses: actions/checkout@v4

            - name: Verification de la configuration Docker Hub
              id: secrets
              # Sans identifiants configures dans les secrets du depot, la
              # publication est ignoree plutot que de faire echouer le tag.
              run: |
                  if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
                    echo "configure=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "configure=false" >> "$GITHUB_OUTPUT"
                    echo "::notice::Secrets DOCKERHUB_USERNAME et DOCKERHUB_TOKEN absents : publication ignoree."
                  fi

            - name: Configuration de Buildx
              if: steps.secrets.outputs.configure == 'true'
              uses: docker/setup-buildx-action@v3

            - name: Connexion a Docker Hub
              if: steps.secrets.outputs.configure == 'true'
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Calcul des etiquettes de l'image
              if: steps.secrets.outputs.configure == 'true'
              id: metadonnees
              uses: docker/metadata-action@v5
              with:
                  images: ${{ secrets.DOCKERHUB_USERNAME }}/tnb
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=raw,value=latest

            - name: Publication de l'image
              if: steps.secrets.outputs.configure == 'true'
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: docker/php/Dockerfile
                  target: prod
                  push: true
                  tags: ${{ steps.metadonnees.outputs.tags }}
                  labels: ${{ steps.metadonnees.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
